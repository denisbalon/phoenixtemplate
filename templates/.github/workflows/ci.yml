name: ci

# Per-iteration fast checks only (B-058). ruff + mypy are cheap and run on
# every PR push for quick feedback. The FULL test suite (`uv run pytest`) is
# deliberately NOT here: it is the merge-node pre-merge gate (B-056/B-058),
# run once against the reviewed head as part of merge -> rebase -> deploy, so
# a PR with many iterations does not re-run the whole suite on every push.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run mypy src
