name: template-self-test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: check-adoption-journal.sh (B-050) needs a merge-base
          # with main. The default shallow single-branch clone has no 'main'
          # ref, so the linter took its cannot-compare path and passed
          # vacuously on every PR — green while checking nothing.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - name: check rule consistency (B-022)
        run: ./scripts/check-rule-consistency.sh
      - name: check doc references (B-023)
        run: ./scripts/check-doc-references.sh
      - name: check placeholders (B-024)
        run: ./scripts/check-placeholders.sh
      - name: check spec consistency (B-029)
        run: ./scripts/check-spec-consistency.sh
      - name: check manifest (B-033)
        run: ./scripts/check-manifest.sh

      - name: Adoption-journal linter (B-050)
        run: ./scripts/check-adoption-journal.sh
      - name: template smoke test (B-014)
        run: ./scripts/smoke-test.sh
